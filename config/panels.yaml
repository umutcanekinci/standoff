# config/panels.yaml — menu layout (static chrome).
# Dynamic objects (character preview/name, room player list, room action button)
# are added in code via panel_manager.add_object().
#
# Coords: panel_bg is a 400x500 box centred in the window; buttons/labels are
# parented to it (positions match the old gui/menu.py layout). Title and the
# player-count line are window-parented (drawn above/below the box).
# Button labels are baked into the button (ride the press), not child objects.

groups:
  menu_chrome:
    title:
      position: [CENTER, 210]
      type: text
      font_size: 60
      color: [255, 0, 0]
      text: "STANDOFF"
    player_count_text:
      position: [CENTER, 820]
      type: text
      font_size: 24
      color: [255, 0, 0]
      background_color: [0, 0, 0]
      text: "You are playing in offline mode !"
    panel_bg:
      position: [CENTER, CENTER]
      size: [400, 500]
      color: [128, 128, 128, 100]

object_templates:
  pill:
    type: ellipse_button
    size: [300, 60]

panels:
  main_menu:
    extends: [menu_chrome]
    objects:
      play:        { extends: pill, parent: panel_bg, position: [CENTER, 80],  text: "PLAY" }
      achievments: { extends: pill, parent: panel_bg, position: [CENTER, 150], text: "ACHIEVMENTS", is_active: false }
      settings:    { extends: pill, parent: panel_bg, position: [CENTER, 220], text: "SETTINGS" }
      credits:     { extends: pill, parent: panel_bg, position: [CENTER, 290], text: "CREDITS", is_active: false }
      exit:        { extends: pill, parent: panel_bg, position: [CENTER, 360], text: "EXIT" }

  player_menu:
    extends: [menu_chrome]
    objects:
      player_name_label:
        type: text
        parent: panel_bg
        position: [CENTER, 40]
        font_size: 40
        text: "PLAYER NAME"
      name_input:
        type: input
        parent: panel_bg
        position: [CENTER, 90]
        size: [300, 40]
        placeholder: "Please enter a player name..."
      previous: { type: triangle_button, parent: panel_bg, position: [75, 185], size: [50, 50], rotation: LEFT }
      next:     { type: triangle_button, parent: panel_bg, position: [275, 185], size: [50, 50], rotation: RIGHT }
      confirm:  { extends: pill, parent: panel_bg, position: [CENTER, 290], text: "CONFIRM" }
      back:     { extends: pill, parent: panel_bg, position: [CENTER, 360], text: "BACK" }

  # Stage 1: how/where to play. The room actions (create/join) used to live here
  # too but were greyed out until you'd connected; they now live on
  # server_lobby_menu, reached only once you're actually on a server — so this
  # screen has no disabled buttons and the connection prerequisite is a real
  # navigation step instead of an invisible one.
  mode_menu:
    extends: [menu_chrome]
    objects:
      play_offline: { extends: pill, parent: panel_bg, position: [CENTER, 110], text: "PLAY OFFLINE" }
      host:         { extends: pill, parent: panel_bg, position: [CENTER, 180], text: "HOST GAME" }
      connect:      { extends: pill, parent: panel_bg, position: [CENTER, 250], text: "CONNECT" }
      back:         { extends: pill, parent: panel_bg, position: [CENTER, 320], text: "BACK" }

  # Stage 2: you are on a server (reached after HOST or CONNECT succeeds). Create
  # a room or browse/join one; DISCONNECT drops the server (and stops hosting if
  # we were the host) and returns to mode_menu.
  server_lobby_menu:
    extends: [menu_chrome]
    objects:
      lobby_label: { type: text, parent: panel_bg, position: [CENTER, 40], font_size: 40, text: "MULTIPLAYER" }
      create_room: { extends: pill, parent: panel_bg, position: [CENTER, 130], text: "CREATE ROOM" }
      join_room:   { extends: pill, parent: panel_bg, position: [CENTER, 200], text: "JOIN ROOM" }
      disconnect:  { extends: pill, parent: panel_bg, position: [CENTER, 300], color: [0, 0, 255], hover_color: [255, 0, 0], text: "DISCONNECT" }

  server_menu:
    extends: [menu_chrome]
    objects:
      server_label: { type: text, parent: panel_bg, position: [CENTER, 30],  font_size: 40, text: "CONNECT TO SERVER" }
      ip_label:     { type: text, parent: panel_bg, position: [CENTER, 95],  font_size: 26, text: "IP ADDRESS" }
      ip_input:     { type: input, parent: panel_bg, position: [CENTER, 135], size: [320, 40], placeholder: "Server IP..." }
      port_label:   { type: text, parent: panel_bg, position: [CENTER, 200], font_size: 26, text: "PORT" }
      port_input:   { type: input, parent: panel_bg, position: [CENTER, 240], size: [320, 40], placeholder: "Port..." }
      status_text:  { type: text, parent: panel_bg, position: [CENTER, 300], font_size: 24, text: "" }
      connect:      { extends: pill, parent: panel_bg, position: [CENTER, 360], text: "CONNECT" }
      back:         { extends: pill, parent: panel_bg, position: [CENTER, 430], text: "BACK" }

  create_room_menu:
    extends: [menu_chrome]
    objects:
      create: { extends: pill, parent: panel_bg, position: [CENTER, 290], text: "CREATE" }
      back:   { extends: pill, parent: panel_bg, position: [CENTER, 360], text: "BACK" }

  # Room browser. The clickable room rows are added in code (LobbyScene
  # ._build_dynamic_objects) like the room_menu slots; the static chrome below is
  # the title, a status line, and the private "join by id" controls.
  connect_menu:
    extends: [menu_chrome]
    objects:
      browser_label: { type: text, parent: panel_bg, position: [CENTER, 18],  font_size: 38, text: "ROOMS" }
      status_text:   { type: text, parent: panel_bg, position: [CENTER, 256], font_size: 22, text: "" }
      room_id_input: { type: input, parent: panel_bg, position: [CENTER, 296], size: [300, 40], placeholder: "Private room ID..." }
      join:          { extends: pill, parent: panel_bg, position: [CENTER, 350], text: "JOIN BY ID" }
      back:          { extends: pill, parent: panel_bg, position: [CENTER, 420], text: "BACK" }

  room_menu:
    extends: [menu_chrome]
    objects:
      room_text:
        type: text
        parent: panel_bg
        position: [CENTER, 20]
        font_size: 40
        text: "ROOM 0"
      leave_room: { extends: pill, parent: panel_bg, position: [CENTER, 300], color: [0, 0, 255], hover_color: [255, 0, 0], text: "LEAVE ROOM" }

  # Window mode/size are desktop-only (Android has no windowing concept) --
  # LobbyScene.open_panel() greys those four triangle buttons out on
  # is_android(), matching how mode_menu's "host" button is gated.
  settings_menu:
    extends: [menu_chrome]
    objects:
      settings_label: { type: text, parent: panel_bg, position: [CENTER, 20], font_size: 34, text: "SETTINGS" }

      window_mode_label: { type: text, parent: panel_bg, position: [CENTER, 62], font_size: 18, text: "WINDOW MODE" }
      window_mode_back:  { type: triangle_button, parent: panel_bg, position: [50, 84],  size: [36, 36], rotation: LEFT }
      window_mode_value: { type: text, parent: panel_bg, position: [CENTER, 92], font_size: 22, text: "FULLSCREEN" }
      window_mode_next:  { type: triangle_button, parent: panel_bg, position: [314, 84], size: [36, 36], rotation: RIGHT }

      window_size_label: { type: text, parent: panel_bg, position: [CENTER, 130], font_size: 18, text: "WINDOW SIZE" }
      window_size_back:  { type: triangle_button, parent: panel_bg, position: [50, 152],  size: [36, 36], rotation: LEFT }
      window_size_value: { type: text, parent: panel_bg, position: [CENTER, 160], font_size: 22, text: "1920x1080" }
      window_size_next:  { type: triangle_button, parent: panel_bg, position: [314, 152], size: [36, 36], rotation: RIGHT }

      sfx_volume_label: { type: text, parent: panel_bg, position: [CENTER, 200], font_size: 18, text: "SFX VOLUME" }
      sfx_volume_value: { type: text, parent: panel_bg, position: [CENTER, 220], font_size: 18, text: "100%" }
      sfx_volume_slider: { type: slider, parent: panel_bg, position: [CENTER, 244], size: [300, 18], value: 1.0 }

      music_volume_label: { type: text, parent: panel_bg, position: [CENTER, 274], font_size: 18, text: "BGM VOLUME" }
      music_volume_value: { type: text, parent: panel_bg, position: [CENTER, 294], font_size: 18, text: "100%" }
      music_volume_slider: { type: slider, parent: panel_bg, position: [CENTER, 318], size: [300, 18], value: 1.0 }

      reset: { extends: pill, parent: panel_bg, position: [CENTER, 356], size: [260, 46], text_size: 26, text: "RESET TO DEFAULT" }
      back:  { extends: pill, parent: panel_bg, position: [CENTER, 414], size: [260, 46], text_size: 26, text: "BACK" }

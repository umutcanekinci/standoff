name: tests

# Runs on GitHub's servers AFTER code arrives there:
#   * every push to any branch
#   * every pull request targeting main
on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Pin the interpreter so we always land on a Python with prebuilt
      # pygame-ce wheels (project allows >=3.12).
      UV_PYTHON: "3.12"
      # Headless SDL so pygame.init() (via Room) works with no display.
      SDL_VIDEODRIVER: dummy
    steps:
      - name: Checkout (with pygame_core submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Run tests
        run: uv run --group dev pytest -q

  # testpaths above is scoped to ./tests, so the vendored submodule's own
  # suite never runs as part of the "test" job -- exercise it separately.
  engine-tests:
    name: pygame_core test suite
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
      SDL_VIDEODRIVER: dummy
    steps:
      - name: Checkout (with pygame_core submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Run pytest
        working-directory: src/pygame_core
        run: uv run --group dev pytest -q

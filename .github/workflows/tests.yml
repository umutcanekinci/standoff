name: tests

# Runs on GitHub's servers AFTER code arrives there:
#   * every push to any branch
#   * every pull request targeting main
on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only this job pushes the regenerated coverage badge
    env:
      # Pin the interpreter so we always land on a Python with prebuilt
      # pygame-ce wheels (project allows >=3.12).
      UV_PYTHON: "3.12"
      # Headless SDL so pygame.init() (via Room) works with no display.
      SDL_VIDEODRIVER: dummy
    steps:
      - name: Checkout (with pygamine submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Run tests with coverage
        run: uv run --group dev pytest -q --cov --cov-report=json --cov-report=term

      # Only on a push to main -- PRs (esp. from forks) may lack push access,
      # and there's no reason to commit on every branch.
      - name: Update coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: uv run pygamine-coverage-badge

      - name: Commit updated badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update coverage badge [skip ci]"
          file_pattern: .github/badges/coverage.json

  # testpaths above is scoped to ./tests, so the vendored submodule's own
  # suite never runs as part of the "test" job -- exercise it separately.
  engine-tests:
    name: pygamine test suite
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
      SDL_VIDEODRIVER: dummy
    steps:
      - name: Checkout (with pygamine submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Run pytest
        working-directory: src/pygamine
        run: uv run --group dev pytest -q

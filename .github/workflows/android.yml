name: build-android

# Builds the debug APK on a Linux runner (buildozer can't run on Windows), so you
# get an installable artifact without setting up WSL + the Android SDK/NDK locally.
# Heavy build (~20-40 min the first time, cached after), so it does NOT run on
# every push — trigger it by hand from the Actions tab, or by pushing a v* tag.
# A v* tag push also publishes the APK to itch.io's `android` channel (see
# publish-itch below); workflow_dispatch runs build-only, for testing the build
# itself without cutting a release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with pygame_core submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Runs buildozer straight from kivy's official image (same one
      # tools/build_android.sh uses under WSL), reading buildozer.spec at the
      # repo root. The first run downloads the Android SDK/NDK and cross-compiles
      # Python + SDL2 + pygame for ARM — this is where a recipe problem (e.g.
      # pygame-ce vs the p4a `pygame` recipe) would surface in the logs.
      #
      # NOTE: this replaced ArtemSBulgakov/buildozer-action@v1, whose own
      # Dockerfile builds on top of this same image but then adds openjdk-17-jdk
      # again via the ppa:openjdk-r/ppa Launchpad PPA — redundant, since the base
      # image already installs openjdk-17-jdk from Ubuntu's own repos — and that
      # PPA step is what started failing the `docker build`, breaking the action
      # before checkout even ran. Going straight to the base image skips it.
      - name: Build debug APK
        run: |
          mkdir -p "$HOME/.buildozer"
          # p4a's "Installing pure Python modules" step runs `pip install -U pip`
          # in a throwaway venv; current pip's vendored resolvelib is broken, so
          # pin older pip the same way tools/build_android.sh does. p4a copies
          # the environment into that venv's build env, so PIP_CONSTRAINT reaches
          # it. Kept out of source.dir (which bundles *.txt into the APK) by
          # writing it into the .buildozer cache mount instead.
          echo 'pip<25' > "$HOME/.buildozer/pip-constraint.txt"
          # recipes/python3/__init__.py's create_python_bundle() shells out to
          # `patchelf` (to fix DT_NEEDED on the bundled stdlib .so files — see
          # that file's docstring). tools/build_android.sh pip-installs it
          # alongside buildozer under WSL; the kivy/buildozer image doesn't
          # ship it, so install it via apt before handing off to the image's
          # own entrypoint (which does the UID-mapping + sudo dance down to
          # the unprivileged build user — apt packages land in /usr/bin, on
          # PATH for every user, so installing as root here is enough).
          yes | docker run --rm --interactive \
            --volume "$HOME/.buildozer":/home/user/.buildozer \
            --volume "$PWD":/home/user/hostcwd \
            --env PIP_CONSTRAINT=/home/user/.buildozer/pip-constraint.txt \
            --entrypoint bash \
            ghcr.io/kivy/buildozer:latest \
            -c 'apt-get update -qq && apt-get install -qq -y --no-install-recommends patchelf && exec /usr/local/bin/entrypoint.sh -v android debug'

      - name: Locate APK
        id: apk
        run: |
          # buildozer names it standoff-<version>-<archs>-debug.apk. Rename to
          # match the standoff-<platform>.<ext> pattern release.yml's desktop
          # bundles use (standoff-windows.zip, standoff-linux.zip, ...), so
          # itch.io and the GitHub Release show consistent names across all
          # four platforms instead of the raw buildozer filename.
          src="$(ls -t bin/*.apk | head -n1)"
          dest="bin/standoff-android-debug.apk"
          mv "$src" "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: standoff-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

  # Mirrors release.yml's publish-itch job (windows/linux/osx channels) for the
  # `android` channel — see docs/itch-page.md, which previously described this
  # as a manual `butler push` step. Only runs on real tag pushes, not
  # workflow_dispatch test runs, same as release.yml.
  publish-itch:
    name: Publish to itch.io
    needs: apk
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: standoff-debug-apk
          path: itch

      - name: Locate downloaded APK
        id: apk
        run: echo "path=$(ls itch/*.apk | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Push Android build
        uses: yeslayla/butler-publish-itchio-action@v1.2.0
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          ITCH_USER: umutcanekinci
          ITCH_GAME: standoff
          CHANNEL: android
          VERSION: ${{ github.ref_name }}
          PACKAGE: ${{ steps.apk.outputs.path }}

  # release.yml's own release job only globs artifacts/*.zip (its desktop
  # bundles), so the APK never lands on the GitHub Release — attach it here
  # instead. Same action release.yml uses to create the release in the first
  # place; called again here it just adds this asset to the existing release
  # for the tag rather than creating a duplicate.
  attach-release:
    name: Attach APK to GitHub Release
    needs: apk
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: standoff-debug-apk
          path: dist

      - name: Attach APK
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
          fail_on_unmatched_files: true

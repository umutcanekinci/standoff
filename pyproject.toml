[project]
name = "standoff"
version = "0.1.6"
requires-python = ">=3.12"
dependencies = [
    "pygame-ce",
    "colorama",
    "pyyaml",
    "pytmx",
    "pygame-core",
]

[tool.uv.sources]
pygame-core = { path = "src/pygame_core", editable = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "pre-commit>=4"]
# Tooling for producing distributable desktop builds (see standoff.spec / CI).
build = ["pyinstaller>=6.0"]

[tool.pytest.ini_options]
# Put the source roots on sys.path so tests can `import net.*` / `app.*`
# without per-file path hacks.
pythonpath = ["src", "src/pygame_core"]
testpaths = ["tests"]
# Categories so the pre-commit hook can run the fast (unit) tests only, leaving
# the socket-backed tests to CI:  pytest -m "not integration and not e2e"
markers = [
    "integration: real-socket loopback tests (slower)",
    "e2e: full-stack end-to-end tests (slowest)",
]

[tool.coverage.run]
# pygame_core is a vendored submodule with its own separate test suite
# (engine-tests in CI) -- the coverage badge should reflect only this app's
# own code. Listed as explicit leaf directories rather than "src" itself:
# coverage.py's static discovery of *unexecuted* files (needed so untested
# modules show as 0% instead of being silently excluded from the total)
# doesn't reliably recurse into subdirectories of a single top-level entry.
source = ["src/app", "src/gameplay", "src/net", "src/ui", "src/util"]

[tool.ruff]
# pygame_core is a vendored sub-package with its own tooling — don't lint it here.
extend-exclude = ["src/pygame_core"]

[tool.ruff.lint]
# conftest imports after a sys.path tweak, so allow module-level imports below
# the top of the file.
ignore = ["E402"]
